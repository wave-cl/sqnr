name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # None of the `test` job's setup is repeated: rustfmt parses rather than
      # compiles and `cargo metadata --no-deps` resolves nothing, so this needs
      # no PC/SC, no cache and no dependency fetch. It answers in seconds.
      #
      # `--all` would work here — squic is a git dependency and there are no
      # path deps at all. The scoped form is used regardless, because `--all`
      # formats the workspace *and the path-based dependencies of its members*,
      # so it silently changes meaning the moment a dependency is switched to a
      # path for local co-development. That is how sqex was once reformatted by
      # accident from sigil, and it is why bti, oxwrt, sqssh, sqex and sigil all
      # use this same form.
      #
      # The package list is derived rather than written out, so adding a crate
      # cannot leave it silently unchecked, and is echoed so a green run shows
      # what it covered rather than only that nothing failed.
      - name: Format
        run: |
          args=()
          while read -r n; do args+=(-p "$n"); done \
            < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          test ${#args[@]} -gt 0
          echo "checking: ${args[*]}"
          cargo fmt "${args[@]}" -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The YubiKey backend links libpcsc (via card-backend-pcsc). macOS has the
      # PCSC framework built in; Linux CI needs the dev package.
      - name: Install PC/SC
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # ring builds from source, so an uncached run is slow enough to
      # discourage anyone from waiting on it.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
