[workspace]
resolver = "2"
members = [
    "crates/sqnr-core",
    "crates/sqnr",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.22.1" }
sqnr-core = { path = "crates/sqnr-core" }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
dirs = "6"
hex = "0.4"
libc = "0.2"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
# Software identity (encrypted at rest) and passphrase/PIN entry.
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# OpenPGP v4 fingerprints are SHA-1 by definition (RFC 4880); nothing is
# authenticated by it, it is card metadata so gpg and ykman can read the key.
sha1 = "0.10"
zeroize = "1"
secrecy = "0.10"
rpassword = "7"
# YubiKey (OpenPGP Ed25519 Authentication key over PC/SC).
openpgp-card = "0.7"
card-backend-pcsc = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info is the bulk of what a test binary carries, and every test target
# statically links the whole workspace plus its dependency tree. Workspace
# crates keep full symbols — that is where a backtrace has to be readable.
# Dependencies drop to line tables, which still give file:line in a panic.
#
# Measured: 78.1 MB -> 50.0 MB for a test binary on x86_64-unknown-linux-gnu,
# and nothing worth having on macOS, which defaults to
# split-debuginfo=unpacked and so never carried the debug info in the binary.
# This is a CI change, not a local one.
#
# profile.test inherits from profile.dev, so this reaches test targets without
# naming them; package."*" restricts it to non-workspace crates.
[profile.dev.package."*"]
debug = "line-tables-only"
