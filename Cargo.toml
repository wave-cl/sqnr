[workspace]
resolver = "2"
members = [
    "crates/sqnr-core",
    "crates/sqnr",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
squic = { git = "https://github.com/wave-cl/squic-rust", tag = "v0.14.0" }
sqnr-core = { path = "crates/sqnr-core" }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
bs58 = "0.5"
dirs = "6"
hex = "0.4"
libc = "0.2"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
# Software identity (encrypted at rest) and passphrase/PIN entry.
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
zeroize = "1"
secrecy = "0.10"
rpassword = "7"
# YubiKey (OpenPGP Ed25519 Authentication key over PC/SC).
openpgp-card = "0.7"
card-backend-pcsc = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
